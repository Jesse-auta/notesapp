services:
  - type: web
    name: notesapp
    runtime: python

    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app

    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: YOUR_DATABASE_SERVICE_NAME
          property: connectionString

      - key: JWT_SECRET_KEY
        sync: false

      - key: GEMINI_API_KEY
        sync: false

      - key: OPENROUTER_API_KEY
        sync: false
services:
  - type: web
    name: notemind-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
     - key: DATABASE_URL
        fromDatabase:
          name: noteapp-db
          property: connectionString
      - key: JWT_SECRET_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false